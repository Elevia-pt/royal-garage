[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# Admin SPA — qualquer subrota dentro de /admin/ devolve o mesmo index
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Pequenas otimizações de cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
