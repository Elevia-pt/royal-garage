[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# Admin SPA — qualquer subrota dentro de /admin/ devolve o mesmo index
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# API → Netlify Functions (URLs limpas)
# Regras mais específicas em cima — Netlify usa "first match wins" para regras equally-specific.
[[redirects]]
  from = "/api/cars/save"
  to = "/.netlify/functions/cars-save"
  status = 200

[[redirects]]
  from = "/api/cars/delete"
  to = "/.netlify/functions/cars-delete"
  status = 200

[[redirects]]
  from = "/api/cars/featured"
  to = "/.netlify/functions/cars-set-featured"
  status = 200

[[redirects]]
  from = "/api/cars/status"
  to = "/.netlify/functions/cars-set-status"
  status = 200

[[redirects]]
  from = "/api/upload/sign"
  to = "/.netlify/functions/upload-sign"
  status = 200

[[redirects]]
  from = "/api/cars"
  to = "/.netlify/functions/cars-list"
  status = 200

# Pequenas otimizações de cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
