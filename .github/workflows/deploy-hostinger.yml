name: Deploy to Hostinger

# Corre em cada push para main + permite trigger manual no painel Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site (Eleventy)
        run: npm run build
        env:
          # admin/config.js precisa destas em build time
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Cache-busting determinístico dos assets (?v=SHA) — ver src/_data/build.js
          ASSET_VERSION: ${{ github.sha }}

      - name: Stage PHP backend + .htaccess para upload
        run: |
          cp -r hostinger/api _site/api
          cp hostinger/.htaccess _site/.htaccess
          # Sanity: lista o que vai subir
          echo "=== Conteúdo de _site/ ==="
          ls -la _site/
          echo "=== API endpoints ==="
          find _site/api -type f

      - name: Deploy via FTP (lftp, retry + incremental por tamanho)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          cat > /tmp/deploy.lftp <<LFTPEOF
          set ftp:ssl-allow true
          set ssl:verify-certificate false
          set ftp:passive-mode true
          set net:max-retries 5
          set net:timeout 20
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 3
          set cmd:fail-exit true
          mirror -R --verbose --ignore-time --exclude-glob .env --exclude-glob .env.* --exclude-glob .git* --exclude-glob node_modules/ ./_site/ "$FTP_DIR"
          bye
          LFTPEOF
          for attempt in 1 2 3 4 5; do
            echo "=== Deploy tentativa $attempt ==="
            if lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" < /tmp/deploy.lftp; then echo "✓ Deploy OK"; exit 0; fi
            echo "Tentativa $attempt falhou; novo retry em 30s…"; sleep 30
          done
          echo "✗ Deploy falhou após 5 tentativas"; exit 1
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}

      - name: Verificar site live pós-deploy
        run: |
          echo "Aguarda 30s para o LiteSpeed propagar o novo conteúdo..."
          sleep 30
          STATUS=$(curl -so /dev/null -w "%{http_code}" \
            -H "Cache-Control: no-cache, no-store" \
            "https://royalgarage.pt/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✓ Site responde 200 OK"
          else
            echo "⚠️ Site retornou $STATUS — pode ser propagação ainda em curso"
            echo "   O watchdog vai confirmar nos próximos 20 minutos."
          fi
